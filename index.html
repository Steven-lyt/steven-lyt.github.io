<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貪吃蛇 Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    user-select: none;
  }
  h1 { margin: 0; font-size: 1.6rem; }
  .info { display: flex; gap: 24px; font-size: 1.1rem; }
  canvas {
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    max-width: 92vw;
    height: auto;
    touch-action: none;
  }
  .controls { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; }
  .controls button {
    height: 56px;
    font-size: 1.4rem;
    border: 1px solid #30363d;
    border-radius: 8px;
    background: #21262d;
    color: #e6edf3;
    cursor: pointer;
  }
  .controls button:active { background: #30363d; }
  .controls .up { grid-column: 2; }
  .controls .left { grid-column: 1; grid-row: 2; }
  .controls .down { grid-column: 2; grid-row: 2; }
  .controls .right { grid-column: 3; grid-row: 2; }
  .actions button {
    padding: 8px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #238636;
    color: #fff;
    cursor: pointer;
  }
  .hint { font-size: 0.85rem; color: #8b949e; }
</style>
</head>
<body>
  <h1>🐍 貪吃蛇</h1>
  <div class="info">
    <div>分數：<span id="score">0</span></div>
    <div>最高分：<span id="best">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="actions">
    <button id="restart">開始 / 重新開始</button>
  </div>
  <div class="controls">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
  </div>
  <div class="hint">方向鍵或 WASD 控制，空白鍵暫停</div>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");

  const GRID = 20;
  const CELL = canvas.width / GRID;

  let snake, dir, nextDir, food, score, timer, speed, running, paused, gameOver;
  let best = 0;
  try { best = Number(localStorage.getItem("snakeBest")) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 140;
    paused = false;
    gameOver = false;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function start() {
    clearInterval(timer);
    reset();
    running = true;
    timer = setInterval(tick, speed);
    draw();
  }

  function setSpeed(ms) {
    clearInterval(timer);
    timer = setInterval(tick, ms);
  }

  function tick() {
    if (paused || gameOver) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) {
      endGame();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("snakeBest", best); } catch (e) {}
      }
      placeFood();
      if (speed > 60 && score % 3 === 0) {
        speed -= 10;
        setSpeed(speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function endGame() {
    gameOver = true;
    running = false;
    clearInterval(timer);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 食物
    ctx.fillStyle = "#f85149";
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#56d364" : "#2ea043";
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });

    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 32px system-ui, sans-serif";
      ctx.fillText("遊戲結束", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "18px system-ui, sans-serif";
      ctx.fillText("分數：" + score, canvas.width / 2, canvas.height / 2 + 24);
    } else if (paused) {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 28px system-ui, sans-serif";
      ctx.fillText("暫停", canvas.width / 2, canvas.height / 2);
    }
  }

  function turn(name) {
    const map = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const d = map[name];
    if (!d) return;
    // 不能直接反向
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  document.addEventListener("keydown", e => {
    const keys = {
      ArrowUp: "up", w: "up", W: "up",
      ArrowDown: "down", s: "down", S: "down",
      ArrowLeft: "left", a: "left", A: "left",
      ArrowRight: "right", d: "right", D: "right"
    };
    if (keys[e.key]) {
      e.preventDefault();
      if (!running && !gameOver) start();
      turn(keys[e.key]);
    } else if (e.key === " ") {
      e.preventDefault();
      if (running) {
        paused = !paused;
        draw();
      }
    }
  });

  document.querySelectorAll(".controls button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!running && !gameOver) start();
      turn(btn.dataset.dir);
    });
  });

  // 手機滑動控制
  let touchX = 0, touchY = 0;
  canvas.addEventListener("touchstart", e => {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (!running && !gameOver) start();
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? "right" : "left");
    else turn(dy > 0 ? "down" : "up");
  });

  document.getElementById("restart").addEventListener("click", start);

  reset();
  draw();
</script>
</body>
</html>
