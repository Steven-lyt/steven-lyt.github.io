<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steven's Arcade</title>
<meta name="description" content="A small browser arcade by Steven. Ten neon games in plain HTML, CSS and JavaScript: Snake, Tetris, 2048, Minesweeper, Tower Defense and more. No installs, no sign-ups.">
<meta name="theme-color" content="#0b1020">
<link rel="canonical" href="https://steven-lyt.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="Steven's Arcade">
<meta property="og:description" content="Ten neon browser games. Pick one and play.">
<meta property="og:url" content="https://steven-lyt.github.io/">
<meta property="og:image" content="https://steven-lyt.github.io/screenshots/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<style>
  :root {
    --bg1: #0b1020;
    --bg2: #1a1038;
    --panel: rgba(255, 255, 255, .055);
    --panel-hi: rgba(255, 255, 255, .09);
    --border: rgba(255, 255, 255, .11);
    --text: #e8ecff;
    --muted: #9099c4;
    --accent: #46f0b4;
    --gold: #ffe45c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 15% -10%, #25306b 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #4a1d6b 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  main { width: min(94vw, 1040px); margin: 0 auto; padding: 44px 0 40px; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

  /* ---- header */
  header { text-align: center; margin-bottom: 22px; }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 6.4vw, 3.2rem);
    font-weight: 800;
    letter-spacing: .08em;
    line-height: 1.1;
    background: linear-gradient(90deg, #3ee8ff, var(--accent), #c06bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .pill {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 5px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--muted); font-size: .8rem; text-decoration: none;
  }
  .pill b { color: var(--text); font-variant-numeric: tabular-nums; }
  a.pill:hover { border-color: var(--gold); color: var(--text); }

  /* ---- hero */
  .hero {
    position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    min-height: 240px; margin-bottom: 26px;
    border-radius: 24px; overflow: hidden;
    border: 1px solid var(--border); background: var(--panel);
    color: inherit; text-decoration: none;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(520px 260px at 10% 0%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%);
  }
  .hero .text { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; padding: 28px 30px; }
  .hero h2 { margin: 0; font-size: clamp(1.6rem, 4.4vw, 2.2rem); font-weight: 800; line-height: 1.15; }
  .hero p { margin: 0; max-width: 40ch; color: var(--muted); font-size: .92rem; }
  .hero .pic { position: relative; min-height: 180px; }
  .hero .pic img, .hero .pic video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 38%);
    mask-image: linear-gradient(90deg, transparent 0, #000 38%);
  }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 3px 11px; border-radius: 999px; font-size: .76rem; font-weight: 700;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .hero .row { display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  .playbtn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-radius: 12px; border: 0;
    background: var(--c); color: #08121f; font: inherit; font-weight: 800; font-size: .95rem;
    box-shadow: 0 8px 26px color-mix(in srgb, var(--c) 35%, transparent);
    transition: transform .15s, filter .15s;
  }
  .hero:hover .playbtn { transform: translateY(-1px); filter: brightness(1.08); }
  .playbtn::before { content: ""; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent currentColor; }
  .best { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; }
  .best b { color: var(--text); }
  .hero:focus-visible { outline-offset: 4px; border-radius: 24px; }

  /* ---- toolbar */
  .toolbar { margin-bottom: 14px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font: inherit; font-size: .82rem; cursor: pointer; transition: color .15s, border-color .15s, background .15s;
  }
  .chip:hover { color: var(--text); border-color: rgba(255, 255, 255, .28); }
  .chip[aria-pressed="true"] { color: #08121f; background: var(--text); border-color: var(--text); font-weight: 700; }
  button.pill { font: inherit; font-size: .8rem; cursor: pointer; align-items: center; color: var(--text); }
  button.pill:hover { border-color: var(--accent); }

  /* ---- cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 16px; }
  .card {
    position: relative; display: flex; flex-direction: column;
    border-radius: 18px; overflow: hidden;
    border: 1px solid var(--border); background: var(--panel);
    color: inherit; text-decoration: none;
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--c);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .45), 0 0 30px color-mix(in srgb, var(--c) 26%, transparent);
  }
  .card:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; border-radius: 18px; }
  .thumb { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #0a0e20; }
  .thumb img, .thumb video, .hero .pic video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb video { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; }
  .hero .pic video { opacity: 0; transition: opacity .4s; }
  .thumb video.on, .hero .pic video.on { opacity: 1; }
  .thumb::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(to top, rgba(11, 16, 32, .85), transparent); }
  .thumb .tag, .thumb .new {
    position: absolute; z-index: 1; top: 10px; padding: 2px 10px; border-radius: 999px;
    font-size: .72rem; font-weight: 700; backdrop-filter: blur(4px);
  }
  .thumb .tag { left: 10px; background: rgba(11, 16, 32, .65); color: var(--text); border: 1px solid rgba(255, 255, 255, .16); }
  .thumb .new { right: 10px; background: var(--c); color: #08121f; }
  .body { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; flex: 1; }
  .card h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 1.08rem; font-weight: 700; }
  .card h2 .ico { font-size: 1.15rem; }
  .card p {
    margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .trophy { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .trophy.full { color: var(--gold); }
  .foot { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }

  /* ---- achievements */
  .ach { margin-top: 34px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel); scroll-margin-top: 16px; }
  .ach summary {
    display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; list-style: none;
  }
  .ach summary::-webkit-details-marker { display: none; }
  .ach summary h3 { margin: 0; font-size: 1rem; font-weight: 700; }
  .ach summary .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .09); overflow: hidden; }
  .ach summary .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffb36b, var(--gold)); }
  .ach summary .n { color: var(--gold); font-variant-numeric: tabular-nums; font-size: .9rem; font-weight: 700; }
  .ach summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; margin-left: 2px; }
  .ach[open] summary::after { transform: rotate(-135deg); }
  .ach .inner { padding: 4px 18px 20px; display: grid; gap: 18px; }
  .group h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: .88rem; font-weight: 700; }
  .group h4 small { margin-left: auto; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .badge { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255, 255, 255, .03); }
  .badge .ic { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; font-size: 1.15rem; background: rgba(255, 255, 255, .07); }
  .badge b { display: block; font-size: .83rem; }
  .badge small { display: block; color: var(--muted); font-size: .72rem; line-height: 1.4; margin-top: 1px; }
  .badge.on { border-color: rgba(255, 228, 92, .45); background: rgba(255, 228, 92, .07); }
  .badge.on .ic { background: rgba(255, 228, 92, .18); }
  .badge.off .ic { filter: grayscale(1); opacity: .45; }
  .badge.off b { color: var(--muted); }

  footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: .78rem; line-height: 1.9; }
  footer a { color: var(--muted); text-underline-offset: 3px; }
  footer a:hover { color: var(--text); }
  noscript ul { list-style: none; padding: 0; display: grid; gap: 8px; }
  noscript a { display: block; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; text-decoration: none; }
  [hidden] { display: none !important; }

  /* ---- small screens */
  @media (max-width: 760px) {
    main { padding-top: 56px; }
    .hero { grid-template-columns: 1fr; min-height: 0; }
    .hero .pic { order: -1; aspect-ratio: 2 / 1; min-height: 0; }
    .hero .pic img, .hero .pic video { -webkit-mask-image: linear-gradient(0deg, transparent 0, #000 45%); mask-image: linear-gradient(0deg, transparent 0, #000 45%); }
    .hero .text { padding: 0 18px 18px; margin-top: -22px; gap: 8px; }
    .hero p { font-size: .86rem; }
  }
  @media (max-width: 560px) {
    .stats { gap: 6px; }
    .pill, button.pill { padding: 4px 10px; font-size: .74rem; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .body { padding: 10px 11px 12px; }
    .card h2 { font-size: .95rem; }
    .card p { font-size: .76rem; -webkit-line-clamp: 2; }
    .thumb .tag { top: 7px; left: 7px; font-size: .66rem; padding: 1px 8px; }
    .ach summary h3 { font-size: .92rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    .card:hover, .card:focus-visible { transform: none; }
    .thumb video { display: none; }
  }
</style>
<script src="shared.js"></script>
</head>
<body>
<main>
  <header>
    <h1>STEVEN'S ARCADE</h1>
    <div class="stats" id="stats"></div>
  </header>

  <a class="hero" id="hero" hidden></a>

  <div class="toolbar">
    <div class="filters" id="filters" role="group" aria-label="Filter games"></div>
  </div>

  <div class="grid" id="grid"></div>
  <noscript>
    <ul>
      <li><a href="snake.html">Snake</a></li><li><a href="tetris.html">Tetris</a></li><li><a href="runner.html">Neon Runner</a></li>
      <li><a href="reaction.html">F1 Reaction</a></li><li><a href="2048.html">2048</a></li><li><a href="volt.html">Volt Dash</a></li>
      <li><a href="breakout.html">Breakout</a></li><li><a href="towerdefense.html">Tower Defense</a></li><li><a href="shooter.html">Space Shooter</a></li>
      <li><a href="mines.html">Minesweeper</a></li>
    </ul>
  </noscript>

  <details class="ach" id="ach">
    <summary>
      <h3>Achievements</h3>
      <span class="bar"><i id="achBar" style="width:0"></i></span>
      <span class="n" id="achN"></span>
    </summary>
    <div class="inner" id="achInner"></div>
  </details>

  <footer>
    <div>Play with a keyboard on desktop or touch on mobile</div>
    <div>Best scores are saved in this browser</div>
    <div><a href="https://github.com/Steven-lyt/steven-lyt.github.io" target="_blank" rel="noopener">Source on GitHub</a></div>
  </footer>
</main>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function json(k, d) { try { const v = JSON.parse(lsGet(k)); return v && typeof v === 'object' ? v : d; } catch (e) { return d; } }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // Keep this list in the order the cards should appear. `best` returns the label parts for the player's record.
  const NEWEST = 'mines';
  const num = key => () => {
    try {
      const o = JSON.parse(lsGet(key) || '{}');
      if (typeof o === 'number') return o > 0 ? String(o) : null;
      const v = Object.values(o).map(Number).filter(n => !isNaN(n));
      const m = v.length ? Math.max(...v) : 0;
      return m > 0 ? String(m) : null;
    } catch (e) { return null; }
  };
  const GAMES = [
    { id: 'snake', href: 'snake.html', icon: '🐍', name: 'Snake', cat: 'Action', c: '#46f0b4',
      desc: 'Eat the food to grow longer and avoid the walls and yourself. Three difficulty levels plus a wrap-around mode.', best: num('snk.bests') },
    { id: 'tetris', href: 'tetris.html', icon: '🧱', name: 'Tetris', cat: 'Puzzle', c: '#b36bff',
      desc: 'Stack the blocks and clear full rows. Includes hold, ghost piece, and combo scoring.', best: num('tet.bests') },
    { id: 'runner', href: 'runner.html', icon: '🤖', name: 'Neon Runner', cat: 'Action', c: '#ff9a3c',
      desc: 'Jump over crystals and duck under drones. The longer you survive, the faster it gets.', best: num('run.best') },
    { id: 'reaction', href: 'reaction.html', icon: '🏁', name: 'F1 Reaction', cat: 'Skill', c: '#ff3b4e',
      desc: 'Five red lights, then lights out. React as fast as you can. The wait is random every time.',
      best: () => { try { const n = Number(JSON.parse(lsGet('rx.best') || '0')); return n > 0 ? (n / 1000).toFixed(3) + ' s' : null; } catch (e) { return null; } } },
    { id: '2048', href: '2048.html', icon: '🔢', name: '2048', cat: 'Puzzle', c: '#ffd23f',
      desc: 'Slide the tiles and merge matching numbers. Reach 2048, then keep going. Includes undo.', best: num('g2048.best') },
    { id: 'volt', href: 'volt.html', icon: '⚡', name: 'Volt Dash', cat: 'Action', c: '#5b8cff',
      desc: 'A side-scrolling platformer. Stomp bugs, bump blocks, dodge spikes and reach the gate. 3 levels.', best: num('vd.best') },
    { id: 'breakout', href: 'breakout.html', icon: '🏓', name: 'Breakout', cat: 'Action', c: '#ff4d9d',
      desc: 'Bounce the ball off your paddle to smash every brick. Catch power-ups for multiball, lasers and more.', best: num('bo.best') },
    { id: 'td', href: 'towerdefense.html', icon: '🏰', name: 'Tower Defense', cat: 'Strategy', c: '#3ee8ff', thumb: 'towerdefense',
      desc: 'Build and upgrade towers to stop waves of enemies. 4 tower types, 3 maps and boss waves.', best: num('td.best') },
    { id: 'shooter', href: 'shooter.html', icon: '🚀', name: 'Space Shooter', cat: 'Action', c: '#8a7bff',
      desc: 'Blast through waves of aliens with auto-fire. Power up your weapon, dodge bullets and bomb the bosses.', best: num('sh.best') },
    { id: 'mines', href: 'mines.html', icon: '💣', name: 'Minesweeper', cat: 'Puzzle', c: '#a3e635',
      desc: 'Clear the field without hitting a mine. Three sizes, a safe first click, flags and chording.',
      best: () => {
        const o = json('ms.best', {});
        for (const [k, n] of [['hard', 'Hard'], ['medium', 'Medium'], ['easy', 'Easy']]) if (typeof o[k] === 'number' && o[k] > 0) return [n, o[k].toFixed(1) + 's'];
        return null;
      } }
  ];
  const CATS = ['All', 'Action', 'Puzzle', 'Strategy', 'Skill'];
  const plays = json('arcade.plays', {});
  const byId = id => GAMES.find(g => g.id === id);

  function bestNode(g) {
    const box = el('span', 'best');
    const v = g.best();
    if (v == null) { box.textContent = 'Not played yet'; return box; }
    box.appendChild(el('span', null, 'Best'));
    box.appendChild(document.createTextNode(' '));
    if (Array.isArray(v)) { box.appendChild(el('span', null, v[0])); box.appendChild(document.createTextNode(' ')); box.appendChild(el('b', null, v[1])); }
    else box.appendChild(el('b', null, v));
    return box;
  }
  const thumbOf = g => 'thumbs/' + (g.thumb || g.id) + '.webp';
  const clipOf = g => 'clips/' + (g.thumb || g.id);

  // Achievement id prefix -> game (or a label pair for the arcade-wide group).
  const PREFIX = { all: ['🕹️', 'Arcade'], snk: 'snake', tet: 'tetris', run: 'runner', rx: 'reaction', g: '2048', vd: 'volt', bo: 'breakout', td: 'td', sp: 'shooter', ms: 'mines' };
  const trophies = {};
  if (window.ACH) for (const a of ACH.list()) {
    const k = a.id.split('_')[0];
    const t = trophies[k] || (trophies[k] = { got: 0, total: 0 });
    t.total++; if (a.unlocked) t.got++;
  }
  const trophyOf = g => { const k = Object.keys(PREFIX).find(k => PREFIX[k] === g.id); return k ? trophies[k] : null; };

  // Short gameplay loops: autoplay in the hero, hover/focus on desktop, in-view on touch.
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  function makeClip(g) {
    const v = el('video'); v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'none';
    v.setAttribute('aria-hidden', 'true'); v.disablePictureInPicture = true; v.tabIndex = -1;
    v.addEventListener('playing', () => v.classList.add('on'));
    v.dataset.src = clipOf(g);
    return v;
  }
  const playClip = v => {
    if (!v.firstChild) {
      for (const [ext, type] of [['webm', 'video/webm'], ['mp4', 'video/mp4']]) {
        const s = el('source'); s.src = v.dataset.src + '.' + ext; s.type = type; v.appendChild(s);
      }
      v.load();
    }
    const p = v.play(); if (p) p.catch(() => {});
  };
  const stopClip = v => { v.pause(); v.classList.remove('on'); };

  // ------------------------------------------------------------ header stats
  const totalPlays = Object.values(plays).reduce((s, p) => s + (p && p.n || 0), 0);
  (function stats() {
    const box = $('stats');
    const pill = (n, label, tag) => {
      const p = el(tag || 'span', 'pill');
      p.appendChild(el('b', null, n)); p.appendChild(el('span', null, label));
      return p;
    };
    box.appendChild(pill(GAMES.length, 'games'));
    if (totalPlays > 0) box.appendChild(pill(totalPlays, 'plays'));
    if (window.ACH) {
      const a = pill(ACH.count() + '/' + ACH.total(), 'achievements', 'a');
      a.href = '#ach';
      a.addEventListener('click', () => { $('ach').open = true; });
      box.appendChild(a);
    }
    const r = el('button', 'pill rand'); r.type = 'button';
    r.appendChild(el('span', null, '🎲')); r.appendChild(el('span', null, 'Random game'));
    r.addEventListener('click', () => { location.href = GAMES[Math.floor(Math.random() * GAMES.length)].href; });
    box.appendChild(r);
  })();

  // ------------------------------------------------------------ hero
  (function hero() {
    let last = null, t = 0;
    for (const [id, p] of Object.entries(plays)) if (p && p.t > t && byId(id)) { last = byId(id); t = p.t; }
    const g = last || byId(NEWEST);
    const h = $('hero');
    h.hidden = false; h.href = g.href; h.style.setProperty('--c', g.c);
    h.setAttribute('aria-label', g.name);
    const text = el('div', 'text');
    text.appendChild(el('span', 'status', last ? 'Last played' : 'New'));
    text.appendChild(el('h2', null, g.name));
    text.appendChild(el('p', null, g.desc));
    const row = el('div', 'row');
    row.appendChild(el('span', 'playbtn', 'Play now'));
    row.appendChild(bestNode(g));
    text.appendChild(row);
    const pic = el('div', 'pic');
    const img = el('img'); img.src = thumbOf(g); img.alt = ''; img.width = 720; img.height = 540; img.decoding = 'async';
    pic.appendChild(img);
    if (!reduceMotion) { const v = makeClip(g); pic.appendChild(v); playClip(v); }
    h.appendChild(text); h.appendChild(pic);
  })();

  // ------------------------------------------------------------ cards + filter
  const grid = $('grid');
  const inView = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
    for (const e of es) { if (e.isIntersecting) playClip(e.target._v); else stopClip(e.target._v); }
  }, { threshold: 0.65 }) : null;
  GAMES.forEach((g, i) => {
    const a = el('a', 'card'); a.href = g.href; a.dataset.cat = g.cat; a.style.setProperty('--c', g.c);
    const th = el('div', 'thumb');
    const img = el('img'); img.src = thumbOf(g); img.alt = ''; img.width = 720; img.height = 540; img.loading = 'lazy'; img.decoding = 'async';
    th.appendChild(img);
    if (!reduceMotion) {
      const v = makeClip(g); th.appendChild(v);
      if (canHover) {
        a.addEventListener('mouseenter', () => playClip(v)); a.addEventListener('mouseleave', () => stopClip(v));
        a.addEventListener('focus', () => playClip(v)); a.addEventListener('blur', () => stopClip(v));
      } else if ('IntersectionObserver' in window) {
        inView.observe(a); a._v = v;
      }
    }
    th.appendChild(el('span', 'tag', g.cat));
    if (g.id === NEWEST) th.appendChild(el('span', 'new', 'New'));
    const body = el('div', 'body');
    const h2 = el('h2'); h2.appendChild(el('span', 'ico', g.icon)); h2.appendChild(el('span', null, g.name));
    body.appendChild(h2);
    body.appendChild(el('p', null, g.desc));
    const foot = el('div', 'foot');
    foot.appendChild(bestNode(g));
    const tr = trophyOf(g);
    if (tr) {
      const t = el('span', 'trophy' + (tr.got === tr.total ? ' full' : '')); t.title = 'Achievements';
      t.appendChild(el('span', null, '🏆')); t.appendChild(document.createTextNode(' ' + tr.got + '/' + tr.total));
      foot.appendChild(t);
    }
    body.appendChild(foot);
    a.appendChild(th); a.appendChild(body);
    grid.appendChild(a);
  });

  const filters = $('filters');
  let current = lsGet('arcade.filter');
  if (!CATS.includes(current)) current = 'All';
  function applyFilter(cat) {
    current = cat; lsSet('arcade.filter', cat);
    filters.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === cat)));
    grid.querySelectorAll('.card').forEach(c => { c.hidden = !(cat === 'All' || c.dataset.cat === cat); });
  }
  CATS.forEach(c => {
    const b = el('button', 'chip', c); b.type = 'button'; b.dataset.cat = c;
    b.addEventListener('click', () => applyFilter(c));
    filters.appendChild(b);
  });
  applyFilter(current);

  // ------------------------------------------------------------ achievements
  (function ach() {
    if (!window.ACH) { $('ach').hidden = true; return; }
    const list = ACH.list(), got = list.filter(a => a.unlocked).length;
    $('achN').textContent = got + ' / ' + list.length;
    $('achBar').style.width = Math.round(got / list.length * 100) + '%';
    const groups = new Map();
    for (const a of list) {
      const key = a.id.split('_')[0];
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(a);
    }
    const inner = $('achInner');
    for (const [key, items] of groups) {
      const meta = PREFIX[key];
      const [icon, name] = Array.isArray(meta) ? meta : [byId(meta).icon, byId(meta).name];
      const grp = el('section', 'group');
      const h = el('h4'); h.appendChild(el('span', null, icon)); h.appendChild(el('span', null, name));
      h.appendChild(el('small', null, items.filter(a => a.unlocked).length + '/' + items.length));
      grp.appendChild(h);
      const gr = el('div', 'achgrid');
      for (const a of items) {
        const b = el('div', 'badge ' + (a.unlocked ? 'on' : 'off'));
        b.appendChild(el('span', 'ic', a.icon));
        const t = el('div'); t.appendChild(el('b', null, a.name)); t.appendChild(el('small', null, a.desc));
        b.appendChild(t); gr.appendChild(b);
      }
      grp.appendChild(gr); inner.appendChild(grp);
    }
    if (location.hash === '#ach') $('ach').open = true;
  })();
})();
</script>
</body>
</html>
