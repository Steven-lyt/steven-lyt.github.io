<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Runner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
  :root {
    --bg1: #0b1020;
    --bg2: #1a1038;
    --panel: rgba(255, 255, 255, .06);
    --border: rgba(255, 255, 255, .12);
    --text: #e8ecff;
    --muted: #8e97c0;
    --accent: #46f0b4;
    --accent2: #5b8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 700px at 15% -10%, #25306b 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #4a1d6b 0%, transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  .back {
    position: absolute;
    top: 8px; left: 10px;
    z-index: 5;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: .75rem;
    text-decoration: none;
    backdrop-filter: blur(6px);
  }
  .back:hover { color: var(--accent); border-color: var(--accent); }
  .app {
    width: min(94vw, 820px);
    padding: 16px 0 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(1.7rem, 6vw, 2.3rem);
    font-weight: 800;
    letter-spacing: .08em;
    background: linear-gradient(90deg, #ff9a3c, #ff5d7a, #c06bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; letter-spacing: .28em; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 10px;
    text-align: center;
    backdrop-filter: blur(8px);
  }
  .stat small { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .14em; }
  .stat b { display: block; margin-top: 2px; font-size: 1.4rem; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .stat b.bump { animation: bump .8s ease-out; }
  @keyframes bump {
    0%, 40%, 80% { color: var(--accent); transform: scale(1.15); }
    20%, 60%, 100% { color: var(--text); transform: scale(1); }
  }

  .stage {
    position: relative;
    aspect-ratio: 2 / 1;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5), 0 0 70px rgba(255, 93, 122, .14);
    touch-action: none;
    cursor: pointer;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .corner { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  .corner button {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, .08);
    color: var(--text);
    font-size: .8rem;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    text-align: center;
    background: rgba(7, 10, 26, .72);
    backdrop-filter: blur(6px);
    transition: opacity .25s;
    cursor: default;
  }
  .overlay.hide { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: clamp(1.2rem, 4.5vw, 2rem); letter-spacing: .06em; }
  .overlay .sub { margin: 0; color: var(--muted); font-size: clamp(.78rem, 2.4vw, .95rem); }
  .scorerow { display: flex; align-items: center; gap: 12px; }
  .bigscore {
    font-size: clamp(1.8rem, 7vw, 3rem);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #ff9a3c, #ff5d7a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: .75rem;
    font-weight: 700;
    color: #2b1a00;
    background: linear-gradient(135deg, #ffd24a, #ff9a3c);
    box-shadow: 0 0 20px rgba(255, 190, 60, .45);
    white-space: nowrap;
  }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 10px 28px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #1a0b00;
    background: linear-gradient(135deg, #ff9a3c, #ff5d7a);
    box-shadow: 0 8px 24px rgba(255, 93, 122, .3);
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(255, 93, 122, .4); }
  .btn:active { transform: scale(.97); }

  .hint { text-align: center; color: var(--muted); font-size: .8rem; line-height: 1.8; }
  .hint kbd {
    padding: 1px 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, .06);
    font-family: inherit;
    font-size: .75rem;
  }
  .pad { display: none; gap: 12px; }
  .pad button {
    flex: 1;
    height: 64px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .08em;
    touch-action: none;
    backdrop-filter: blur(8px);
  }
  .pad button:active { background: rgba(255, 154, 60, .25); }
  @media (pointer: coarse) { .pad { display: flex; } .hint { display: none; } }
  @media (max-width: 520px) {
    .overlay { gap: 6px; padding: 8px; }
    .overlay .sub { display: none; }
    .btn { padding: 8px 22px; font-size: .9rem; }
  }
</style>
</head>
<body>
<a class="back" href="./">← Menu</a>
<div class="app">
  <header>
    <h1>NEON RUNNER</h1>
    <p>CLASSIC ARCADE</p>
  </header>

  <div class="stats">
    <div class="stat"><small>SCORE</small><b id="score">00000</b></div>
    <div class="stat"><small>BEST</small><b id="best">00000</b></div>
    <div class="stat"><small>SPEED</small><b id="speed">x1.0</b></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="corner">
      <button id="soundBtn" title="Sound">🔊</button>
      <button id="pauseBtn" title="Pause">⏸</button>
    </div>

    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Neon Runner</h2>
      <div class="scorerow" id="ovRow" hidden>
        <div class="bigscore" id="ovScore">0</div>
        <div class="badge" id="ovBadge" hidden>🏆 New record!</div>
      </div>
      <p class="sub" id="ovSub"></p>
      <button class="btn" id="ovBtn">Start Game</button>
    </div>
  </div>

  <div class="pad" id="pad">
    <button data-a="duck">DUCK ▼</button>
    <button data-a="jump">JUMP ▲</button>
  </div>

  <div class="hint">
    <kbd>Space</kbd> / <kbd>↑</kbd> jump (hold for a higher jump) &emsp;<kbd>↓</kbd> duck / fast fall &emsp;<kbd>P</kbd> pause
  </div>
</div>

<script>
(() => {
  // ---------- Setup ----------
  const W = 640, H = 320, GROUND = 262;
  const TAU = Math.PI * 2;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const PX = 70;                      // player x
  const G = 2600, JUMP_V = 780, CUT_V = 380, FAST_FALL = 2.4;
  const V0 = 280, VMAX = 1000, ACCEL = 9;   // start speed, top speed (x3.6), speed gain per second

  const $ = id => document.getElementById(id);
  const stage = $('stage'), overlay = $('overlay');
  const canvas = $('game'), ctx = canvas.getContext('2d');
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
  const scoreEl = $('score'), bestEl = $('best'), speedEl = $('speed');
  const ovTitle = $('ovTitle'), ovRow = $('ovRow'), ovScore = $('ovScore'), ovBadge = $('ovBadge');
  const ovSub = $('ovSub'), ovBtn = $('ovBtn'), soundBtn = $('soundBtn');

  // ---------- Storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let best = Number(store.get('run.best', 0)) || 0;
  let soundOn = store.get('run.sound', true) !== false;

  // ---------- State ----------
  let state = 'menu';               // menu | playing | paused | over
  let score = 0, dist = 0, scroll = 0, speed = V0, playTime = 0;
  let obstacles = [], particles = [];
  let spawnDist = 0, nextGap = 520;
  let overAt = 0, shakeUntil = 0, flashUntil = 0, newRecord = false;
  let jumpBuffer = 0, jumpHeld = false, duckHeld = false, dustTimer = 0;
  const P = { y: GROUND, vy: 0, onGround: true, coyote: 0, ducking: false };

  // ---------- Sound ----------
  let actx = null;
  function beep(freq, dur, type, vol, slideTo) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol || .05, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }

  // ---------- Palettes (colors shift as you score) ----------
  const PAL = [
    { sunA: [255, 120, 200], sunB: [255, 200, 80],  glow: [91, 140, 255],  acc: [70, 240, 180] },
    { sunA: [255, 93, 122],  sunB: [255, 170, 60],  glow: [255, 93, 122],  acc: [255, 200, 90] },
    { sunA: [120, 180, 255], sunB: [190, 110, 255], glow: [179, 107, 255], acc: [62, 232, 255] }
  ];
  const cur = {
    sunA: PAL[0].sunA.slice(), sunB: PAL[0].sunB.slice(),
    glow: PAL[0].glow.slice(), acc: PAL[0].acc.slice()
  };
  let palIdx = 0;
  const rgba = (a, al) => 'rgba(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ',' + al + ')';
  function lerpPalette(dt) {
    const k = 1 - Math.exp(-dt * 1.4), t = PAL[palIdx];
    for (const key in cur) for (let i = 0; i < 3; i++) cur[key][i] += (t[key][i] - cur[key][i]) * k;
  }

  // ---------- Scenery (generated once) ----------
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = rng(20261015);
  const LAYER_W = 1280;
  const buildings = [];
  for (let x = 0; x < LAYER_W;) {
    const w = 30 + Math.floor(rand() * 40), h = 40 + Math.floor(rand() * 90);
    const wins = [];
    for (let wy = 10; wy < h - 6; wy += 10)
      for (let wx = 6; wx < w - 8; wx += 9)
        if (rand() > .68) wins.push([wx, wy]);
    buildings.push({ x, w, h, wins });
    x += w + 2 + Math.floor(rand() * 10);
  }
  const stars = Array.from({ length: 38 }, () => ({
    x: rand() * W, y: rand() * (GROUND - 110), r: .6 + rand() * 1.3, ph: rand() * TAU
  }));
  const ticks = Array.from({ length: 34 }, () => ({ x: rand() * LAYER_W, w: 4 + rand() * 12 }));
  const streaks = Array.from({ length: 7 }, () => ({ x: rand() * W, y: 40 + rand() * (GROUND - 70), w: 30 + rand() * 60 }));

  // ---------- Helpers ----------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function rr(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const pad5 = n => String(n).padStart(5, '0');

  // ---------- Game logic ----------
  function resetGame() {
    score = 0; dist = 0; scroll = 0; speed = V0; playTime = 0;
    obstacles = []; particles = [];
    spawnDist = 0; nextGap = 520;
    jumpBuffer = 0; jumpHeld = false; dustTimer = 0;
    P.y = GROUND; P.vy = 0; P.onGround = true; P.coyote = 0; P.ducking = false;
    newRecord = false; palIdx = 0;
    updateHud();
  }

  function startGame() {
    resetGame();
    state = 'playing';
    overlay.classList.add('hide');
    beep(520, .1, 'square', .04, 780);
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    showOverlay('paused');
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    overlay.classList.add('hide');
  }

  function doJump() {
    P.vy = jumpHeld ? -JUMP_V : -600;   // a very quick tap still gives a usable hop
    P.onGround = false; P.coyote = 0; jumpBuffer = 0;
    beep(420, .1, 'square', .04, 760);
  }

  function spawnObstacle() {
    let o;
    if (score >= 120 && Math.random() < .3) {
      const lift = [34, 52, 100][Math.floor(Math.random() * 3)];   // low / mid / high lane
      o = { kind: 'drone', x: W + 30, y: GROUND - lift, w: 36, h: 20, ph: Math.random() * 6 };
    } else {
      const tall = Math.random() < .4;
      const count = tall ? 1 + Math.floor(Math.random() * 2) : 1 + Math.floor(Math.random() * 3);
      const spikes = [];
      let dx = 0;
      for (let i = 0; i < count; i++) {
        const sw = tall ? 24 : 20;
        const sh = tall ? 52 + Math.random() * 10 : 28 + Math.random() * 12;
        spikes.push({ dx, w: sw, h: sh });
        dx += sw + 2;
      }
      o = { kind: 'crystal', x: W + 30, w: dx - 2, spikes };
    }
    obstacles.push(o);
    nextGap = o.w + speed * (.75 + Math.random() * .85) + (o.kind === 'drone' ? speed * .15 : 0);
    spawnDist = 0;
  }

  function playerBox() {
    const d = P.ducking;
    const w = d ? 54 : 40, h = d ? 26 : 44;
    return { x: PX + 6, y: P.y - h + 5, w: w - 12, h: h - 8 };
  }

  function collided() {
    const p = playerBox();
    for (const o of obstacles) {
      if (o.x > PX + 90 || o.x + o.w < PX - 10) continue;
      if (o.kind === 'drone') {
        if (overlap(p, { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 6 })) return true;
      } else {
        for (const s of o.spikes)
          if (overlap(p, { x: o.x + s.dx + s.w * .22, y: GROUND - s.h * .85, w: s.w * .56, h: s.h * .85 })) return true;
      }
    }
    return false;
  }

  function die() {
    state = 'over';
    const now = performance.now();
    overAt = now + 700;
    shakeUntil = now + 350;
    flashUntil = now + 220;
    const b = playerBox();
    burst(b.x + b.w / 2, b.y + b.h / 2, [[255, 93, 122], [255, 154, 60], [255, 255, 255]], 28, 260);
    beep(200, .45, 'sawtooth', .06, 50);
    if (score > best) { best = score; newRecord = true; store.set('run.best', best); }
    updateHud();
    setTimeout(() => { if (state === 'over') showOverlay('over'); }, 700);
  }

  function update(dt) {
    lerpPalette(dt);
    if (state === 'menu') { scroll += 90 * dt; }
    if (state === 'playing') updatePlaying(dt);
    updateParticles(dt);
  }

  function updatePlaying(dt) {
    playTime += dt;
    speed = Math.min(VMAX, V0 + playTime * ACCEL);
    const dx = speed * dt;
    dist += dx; scroll += dx;

    const ns = Math.floor(dist / 30);
    if (ns !== score) {
      const prev = score;
      score = ns;
      if (Math.floor(score / 100) > Math.floor(prev / 100)) {
        scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
        beep(880, .08, 'square', .04);
        setTimeout(() => beep(1320, .1, 'square', .04), 90);
      }
      palIdx = Math.floor(score / 400) % PAL.length;
      updateHud();
    }

    // player physics
    if (jumpBuffer > 0) jumpBuffer -= dt;
    P.coyote = P.onGround ? .08 : P.coyote - dt;
    if (jumpBuffer > 0 && (P.onGround || P.coyote > 0)) doJump();

    const g = (duckHeld && !P.onGround) ? G * FAST_FALL : G;
    P.vy += g * dt;
    P.y += P.vy * dt;
    if (P.y >= GROUND) {
      if (!P.onGround) burst(PX + 20, GROUND, [cur.acc], 7, 90);
      P.y = GROUND; P.vy = 0; P.onGround = true;
    } else {
      P.onGround = false;
    }
    P.ducking = duckHeld && P.onGround;

    // dust while running
    dustTimer -= dt;
    if (P.onGround && dustTimer <= 0) {
      dustTimer = .07;
      particles.push({ x: PX + 6, y: GROUND - 1, vx: -speed * .35 - Math.random() * 40, vy: -10 - Math.random() * 40,
        life: .35, max: .35, size: 1.5 + Math.random() * 1.5, color: cur.acc.slice() });
    }

    // obstacles
    spawnDist += dx;
    if (spawnDist >= nextGap) spawnObstacle();
    for (const o of obstacles) o.x -= dx;
    while (obstacles.length && obstacles[0].x + obstacles[0].w < -40) obstacles.shift();

    if (collided()) die();
  }

  // ---------- UI ----------
  function updateHud() {
    scoreEl.textContent = pad5(score);
    bestEl.textContent = pad5(Math.max(best, score));
    speedEl.textContent = 'x' + (speed / V0).toFixed(1);
  }

  function showOverlay(mode) {
    overlay.classList.remove('hide');
    ovRow.hidden = true;
    ovBadge.hidden = true;
    if (mode === 'menu') {
      ovTitle.textContent = 'Neon Runner';
      ovSub.textContent = 'Jump over crystals and duck under drones.';
      ovBtn.textContent = 'Start Game';
    } else if (mode === 'paused') {
      ovTitle.textContent = 'Paused';
      ovSub.textContent = '';
      ovBtn.textContent = 'Resume';
    } else {
      ovTitle.textContent = 'Game Over';
      ovRow.hidden = false;
      ovScore.textContent = score;
      ovBadge.hidden = !newRecord;
      ovSub.textContent = 'Best ' + Math.max(best, score);
      ovBtn.textContent = 'Play Again';
    }
  }

  function syncSound() { soundBtn.textContent = soundOn ? '🔊' : '🔇'; }

  // ---------- Particles ----------
  function burst(x, y, colors, n, sp) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = sp * (.3 + Math.random() * .7);
      const life = .4 + Math.random() * .4;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life, max: life, size: 1.5 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)].slice()
      });
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 500 * dt;
    }
  }

  // ---------- Drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#0a0e22');
    g.addColorStop(1, '#1a1038');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const hg = ctx.createRadialGradient(W * .7, GROUND, 10, W * .7, GROUND, 330);
    hg.addColorStop(0, rgba(cur.glow, .32));
    hg.addColorStop(1, rgba(cur.glow, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, GROUND);
  }

  function drawStars(t) {
    for (const s of stars) {
      const x = ((s.x - scroll * .03) % W + W) % W;
      ctx.globalAlpha = .35 + .5 * Math.abs(Math.sin(t * 1.5 + s.ph));
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawSun() {
    const cx = W * .7, cy = GROUND - 78, R = 64;
    const g = ctx.createLinearGradient(0, cy - R, 0, cy + R);
    g.addColorStop(0, rgba(cur.sunB, 1));
    g.addColorStop(1, rgba(cur.sunA, 1));
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
    ctx.fillStyle = g;
    const bandH = (R * 2) / 10;
    for (let k = 0; k < 10; k++) {
      const gap = (k / 9) * bandH * .75;
      ctx.fillRect(cx - R, cy - R + k * bandH, R * 2, bandH - gap);
    }
    ctx.restore();
  }

  function drawSkyline() {
    const off = (scroll * .12) % LAYER_W;
    for (let k = 0; k < 2; k++) {
      for (const b of buildings) {
        const x = b.x - off + k * LAYER_W;
        if (x > W || x + b.w < 0) continue;
        const y = GROUND - b.h;
        ctx.fillStyle = '#110d2a';
        ctx.fillRect(x, y, b.w, b.h);
        ctx.fillStyle = rgba(cur.glow, .55);
        ctx.fillRect(x, y, b.w, 1.5);
        ctx.fillStyle = rgba(cur.acc, .5);
        ctx.beginPath();
        for (const w of b.wins) ctx.rect(x + w[0], y + w[1], 3, 4);
        ctx.fill();
      }
    }
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#16103a');
    g.addColorStop(1, '#0a0a1e');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(cur.glow, .16);
    ctx.beginPath();
    for (const y of [GROUND + 10, GROUND + 24, GROUND + 42]) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    const sp = 56, off = scroll % sp;
    for (let x = -off; x < W + sp; x += sp) { ctx.moveTo(x, GROUND); ctx.lineTo(x + (x - W / 2) * .6, H); }
    ctx.stroke();

    ctx.fillStyle = rgba(cur.acc, .35);
    const toff = scroll % LAYER_W;
    for (let k = 0; k < 2; k++)
      for (const t of ticks) {
        const x = t.x - toff + k * LAYER_W;
        if (x > -20 && x < W) ctx.fillRect(x, GROUND + 6, t.w, 1.5);
      }

    ctx.save();
    ctx.strokeStyle = rgba(cur.acc, .95);
    ctx.lineWidth = 2;
    ctx.shadowColor = rgba(cur.acc, .9);
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(0, GROUND + 1); ctx.lineTo(W, GROUND + 1); ctx.stroke();
    ctx.restore();
  }

  function drawStreaks() {
    const a = clamp((speed - 380) / 300, 0, 1) * .25;
    if (a <= 0 || state !== 'playing') return;
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    for (const s of streaks) {
      const x = ((s.x - scroll * 1.4) % (W + 100) + (W + 100)) % (W + 100) - 50;
      ctx.fillRect(x, s.y, s.w, 1);
    }
  }

  function drawCrystal(o) {
    ctx.save();
    ctx.shadowColor = 'rgba(255,93,162,.8)';
    ctx.shadowBlur = 14;
    for (const s of o.spikes) {
      const x = o.x + s.dx, top = GROUND - s.h, mid = x + s.w / 2;
      ctx.fillStyle = '#ff7ac0';
      ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(mid, top); ctx.lineTo(mid, GROUND); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8a2cff';
      ctx.beginPath(); ctx.moveTo(mid, top); ctx.lineTo(x + s.w, GROUND); ctx.lineTo(mid, GROUND); ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1;
    for (const s of o.spikes) {
      const x = o.x + s.dx, top = GROUND - s.h, mid = x + s.w / 2;
      ctx.beginPath(); ctx.moveTo(mid - .5, top + 3); ctx.lineTo(mid - .5, GROUND - 3); ctx.stroke();
    }
    ctx.restore();
  }

  function drawDrone(o, t) {
    const x = o.x, y = o.y;
    ctx.save();
    ctx.shadowColor = 'rgba(255,154,60,.85)';
    ctx.shadowBlur = 14;
    const g = ctx.createLinearGradient(0, y + 6, 0, y + 20);
    g.addColorStop(0, '#ffb454');
    g.addColorStop(1, '#ff5d3c');
    ctx.fillStyle = g;
    rr(ctx, x, y + 6, 36, 14, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0e22';
    rr(ctx, x + 3, y + 9, 12, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#46f0ff';
    ctx.fillRect(x + 5, y + 11, 5, 3);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.fillRect(x + 20, y + 10, 12, 1.5);
    ctx.fillStyle = '#c9c2e8';
    ctx.fillRect(x + 17, y + 2, 2, 5);
    const bw = 3 + 15 * Math.abs(Math.cos(t * 38 + o.ph));
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(x + 18, y + 2, bw, 1.8, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawPlayer(t) {
    const dead = state === 'over';
    const duck = P.ducking && !dead;
    const air = !P.onGround;
    const x = PX, foot = P.y;
    const phase = scroll * .05;

    ctx.save();
    ctx.shadowColor = dead ? 'rgba(255,93,122,.8)' : 'rgba(62,232,255,.75)';
    ctx.shadowBlur = 14;

    const bodyGrad = (top, h) => {
      const g = ctx.createLinearGradient(0, top, 0, top + h);
      if (dead) { g.addColorStop(0, '#ff8aa0'); g.addColorStop(1, '#a03050'); }
      else { g.addColorStop(0, '#6ff0ff'); g.addColorStop(1, '#4a7cff'); }
      return g;
    };

    if (duck) {
      const top = foot - 24;
      // legs
      ctx.fillStyle = '#2a3a8a';
      const lift = Math.sin(phase * 1.6) > 0 ? 2 : 0;
      rr(ctx, x + 8, foot - 6 - lift, 10, 6, 2); ctx.fill();
      rr(ctx, x + 30, foot - 6 - (lift ? 0 : 2), 10, 6, 2); ctx.fill();
      // body
      ctx.fillStyle = bodyGrad(top, 20);
      rr(ctx, x, top, 54, 20, 8); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a0e22';
      rr(ctx, x + 28, top + 4, 22, 9, 4); ctx.fill();
      ctx.fillStyle = '#7dffd8';
      ctx.fillRect(x + 40, top + 6, 8, 5);
    } else {
      const top = foot - 44;
      // antenna
      ctx.strokeStyle = dead ? '#ff8aa0' : '#9fe9ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 20, top + 7); ctx.lineTo(x + 20, top + 1); ctx.stroke();
      ctx.fillStyle = dead ? '#ff5d7a' : '#7dffd8';
      ctx.beginPath(); ctx.arc(x + 20, top + 1, 2.2, 0, TAU); ctx.fill();
      // legs
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#2a3a8a';
      if (air || dead) {
        rr(ctx, x + 9, foot - 7, 9, 7, 2); ctx.fill();
        rr(ctx, x + 22, foot - 9, 9, 7, 2); ctx.fill();
      } else {
        const s = Math.sin(phase);
        const l1 = Math.max(0, s) * 5, l2 = Math.max(0, -s) * 5;
        rr(ctx, x + 9 + l1 * .4, foot - 10 - l1, 9, 10, 2); ctx.fill();
        rr(ctx, x + 22 + l2 * .4, foot - 10 - l2, 9, 10, 2); ctx.fill();
      }
      // body
      ctx.shadowColor = dead ? 'rgba(255,93,122,.8)' : 'rgba(62,232,255,.75)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = bodyGrad(top + 6, 28);
      rr(ctx, x + 2, top + 6, 36, 29, 9); ctx.fill();
      ctx.shadowBlur = 0;
      // visor
      ctx.fillStyle = '#0a0e22';
      rr(ctx, x + 14, top + 12, 24, 11, 5); ctx.fill();
      if (dead) {
        ctx.strokeStyle = '#ff5d7a'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 27, top + 14); ctx.lineTo(x + 33, top + 21);
        ctx.moveTo(x + 33, top + 14); ctx.lineTo(x + 27, top + 21);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#7dffd8';
        ctx.globalAlpha = .75 + .25 * Math.sin(t * 8);
        ctx.fillRect(x + 27, top + 14, 8, 6);
        ctx.globalAlpha = 1;
      }
      // chest light
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fillRect(x + 8, top + 27, 10, 2);
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.fillStyle = rgba(p.color, a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.4 + .6 * a), 0, TAU); ctx.fill();
    }
  }

  function render(now) {
    const t = now / 1000;
    ctx.save();
    if (shakeUntil > now) {
      const k = (shakeUntil - now) / 350 * 5;
      ctx.translate((Math.random() - .5) * k, (Math.random() - .5) * k);
    }
    drawSky();
    drawStars(t);
    drawSun();
    drawSkyline();
    drawGround();
    drawStreaks();
    for (const o of obstacles) { if (o.kind === 'drone') drawDrone(o, t); else drawCrystal(o); }
    drawPlayer(t);
    drawParticles();
    ctx.restore();

    if (flashUntil > now) {
      ctx.fillStyle = 'rgba(255,93,122,' + (.35 * (flashUntil - now) / 220) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    update(dt);
    render(now);
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  function onJumpPress() {
    if (state === 'menu') { startGame(); jumpBuffer = .12; jumpHeld = true; }
    else if (state === 'over') { if (performance.now() > overAt) startGame(); }
    else if (state === 'paused') resumeGame();
    else if (state === 'playing') { jumpBuffer = .12; jumpHeld = true; }
  }
  function onJumpRelease() {
    jumpHeld = false;
    if (state === 'playing' && !P.onGround && P.vy < -CUT_V) P.vy = -CUT_V;
  }
  function setDuck(v) { duckHeld = v; }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'arrowup' || k === 'w' || k === 'enter') {
      e.preventDefault();
      if (!e.repeat) onJumpPress();
    } else if (k === 'arrowdown' || k === 's') {
      e.preventDefault();
      setDuck(true);
    } else if (k === 'p' || k === 'escape') {
      if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
    }
  });
  document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'arrowup' || k === 'w') onJumpRelease();
    else if (k === 'arrowdown' || k === 's') setDuck(false);
  });
  window.addEventListener('blur', () => { setDuck(false); jumpHeld = false; });

  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    onJumpPress();
  });
  window.addEventListener('pointerup', () => { if (jumpHeld) onJumpRelease(); });
  window.addEventListener('pointercancel', () => { if (jumpHeld) onJumpRelease(); });

  document.querySelectorAll('#pad button').forEach(b => {
    const a = b.dataset.a;
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (a === 'jump') onJumpPress(); else setDuck(true);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => {
      if (a === 'jump') onJumpRelease(); else setDuck(false);
    }));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  $('pauseBtn').addEventListener('click', e => { pauseGame(); e.currentTarget.blur(); });
  soundBtn.addEventListener('click', e => {
    soundOn = !soundOn; store.set('run.sound', soundOn); syncSound();
    if (soundOn) beep(660, .1, 'square', .04);
    e.currentTarget.blur();
  });
  ovBtn.addEventListener('click', e => {
    e.currentTarget.blur();
    if (state === 'paused') resumeGame();
    else if (state === 'menu' || (state === 'over' && performance.now() > overAt)) startGame();
  });
  ovBtn.addEventListener('pointerdown', e => e.stopPropagation());

  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

  // ---------- Start ----------
  resetGame();
  syncSound();
  showOverlay('menu');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
